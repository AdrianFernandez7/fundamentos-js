<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 21</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <main>
    <p><a href="../">&larr; Volver a la portada</a></p>
    <h1>Ejercicio 21</h1>

    <section class="enunciado">
      <h2>Enunciado</h2>
      <p>Crea una funcion que reciba un array de numeros y un valor, y devuelva un nuevo array con los numeros mayores que ese valor. Usa filter(). Los iguales al limite no se incluyen.</p>
    </section>

    <section class="entrada">
      <h2>Entrada</h2>
      <label for="lista">Numeros separados por comas:</label>
      <input type="text" id="lista" value="1, 5, 10, 15, 20, 10">
      <label for="limite">Valor limite:</label>
      <input type="text" id="limite" value="10">
      <button id="btn">Ejecutar</button>
    </section>

    <section class="salida">
      <h2>Salida</h2>
      <pre id="salida"></pre>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
