<!DOCTYPE html>
<html lang="es">
<head>

  <title>Ejercicio 12</title>

</head>
<body>
  <main>
    <p><a href="../">&larr; Volver a la portada</a></p>
    <h1>Ejercicio 12</h1>

    <section class="enunciado">
      <h2>Enunciado</h2>
      <p>Crea una funcion que reciba un array de numeros y devuelva otro con solo los pares. Usa filter() y %.</p>
    </section>

    <section class="entrada">
      <h2>Entrada</h2>
      <label for="lista">Numeros separados por comas:</label>
      <input type="text" id="lista" value="1, 2, 3, 4, 5, 6, 7, 8, 10, 15">
      <button id="btn">Ejecutar</button>
    </section>

    <section class="salida">
      <h2>Salida</h2>
      <pre id="salida"></pre>
    </section>
  </main>

  <script src="app.js"></script>
</body>
