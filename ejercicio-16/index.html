<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 16</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <main>
    <p><a href="../">&larr; Volver a la portada</a></p>
    <h1>Ejercicio 16</h1>

    <section class="enunciado">
      <h2>Enunciado</h2>
      <p>Crea una funcion que convierta grados Celsius a Fahrenheit con la formula F = (C x 9/5) + 32.</p>
    </section>

    <section class="entrada">
      <h2>Entrada</h2>
      <label for="celsius">Grados Celsius:</label>
      <input type="text" id="celsius" value="100">
      <p>Comprobacion: 0 C = 32 F y 100 C = 212 F.</p>
      <button id="btn">Ejecutar</button>
    </section>

    <section class="salida">
      <h2>Salida</h2>
      <pre id="salida"></pre>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
