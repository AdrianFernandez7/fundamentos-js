<!DOCTYPE html>
<html lang="es">
<head>

  <title>Ejercicio 19</title>

<body>
  <main>
    <p><a href="../">&larr; Volver a la portada</a></p>
    <h1>Ejercicio 19</h1>

    <section class="enunciado">
      <h2>Enunciado</h2>
      <p>Crea una funcion que reciba un array de numeros y calcule su promedio con reduce().</p>
    </section>

    <section class="entrada">
      <h2>Entrada</h2>
      <label for="lista">Numeros separados por comas:</label>
      <input type="text" id="lista" value="4, 8, 15, 16, 23, 42">
      <p>Si lo dejas vacio, se avisa de que no hay numeros.</p>
      <button id="btn">Ejecutar</button>
    </section>

    <section class="salida">
      <h2>Salida</h2>
      <pre id="salida"></pre>
    </section>
  </main>

  <script src="app.js"></script>
