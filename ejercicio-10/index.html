    <section class="enunciado">
      <h2>Enunciado</h2>
      <p>Crea una funcion que encuentre el numero mas grande de un array usando Math.max() y el operador de expansion (...).</p>
    </section>

    <section class="entrada">
      <h2>Entrada</h2>
      <label for="lista">Numeros separados por comas:</label>

      <p>Prueba tambien con negativos: -5, -2, -10</p>
      <button id="btn">Ejecutar</button>
    </section>

      <pre id="salida"></pre>
    </section>
