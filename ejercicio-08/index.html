<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 8</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <main>
    <p><a href="../">&larr; Volver a la portada</a></p>
    <h1>Ejercicio 8</h1>

    <section class="enunciado">
      <h2>Enunciado</h2>
      <p>Crea una funcion azar(min, max) que genere un entero aleatorio dentro de un intervalo, por ejemplo azar(-5, 10). Ambos limites estan incluidos.</p>
    </section>

    <section class="entrada">
      <h2>Entrada</h2>
      <label for="min">Minimo:</label>
      <input type="text" id="min" value="-5">
      <label for="max">Maximo:</label>
      <input type="text" id="max" value="10">
      <button id="btn">Ejecutar</button>
    </section>

    <section class="salida">
      <h2>Salida</h2>
      <pre id="salida"></pre>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
